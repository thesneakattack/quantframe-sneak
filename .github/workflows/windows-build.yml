# Produces a runnable Windows build on demand.
#
# Separate from build.yml, which fans out across four platforms and opens a draft
# release - too heavy when all you want is an installer to try. This builds only
# windows-latest and leaves the result as a downloadable workflow artifact, so
# nothing is published.
#
#   gh workflow run windows-build.yml
#   gh run download <run-id> -D ./dist-windows
name: Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Matches the "packageManager" field in package.json.
          version: 9.12.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        # No signing env: this fork sets createUpdaterArtifacts=false and ships no
        # private key, so tauri-action's signing variables are intentionally absent.
        # See docs/FORK.md for how to enable updates later.
        run: pnpm tauri build

      - name: List build output
        shell: bash
        run: |
          echo "--- bundle tree ---"
          find src-tauri/target/release/bundle -type f 2>/dev/null || true
          echo "--- bare exe ---"
          ls -la src-tauri/target/release/*.exe 2>/dev/null || true

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: quantframe-sneak-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/QuantframeSneak.exe
          if-no-files-found: error
          retention-days: 14
